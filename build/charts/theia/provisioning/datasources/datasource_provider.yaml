apiVersion: 1
datasources:
  - name: ClickHouse
    # Dashboard JSON files reference this UID.
    uid: PDEE91DDB90597936
    type: grafana-clickhouse-datasource
    access: proxy
    editable: true
    jsonData:
      host: clickhouse-clickhouse.{{ .Release.Namespace }}.svc
      port: {{ .Values.clickhouse.service.tcpPort }}
      protocol: native
      defaultDatabase: default
      username: $CLICKHOUSE_USERNAME
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
