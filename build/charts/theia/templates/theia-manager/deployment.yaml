{{- if .Values.theiaManager.enable }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: theia-manager
  name: theia-manager
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: theia-manager
  template:
    metadata:
      labels:
        app: theia-manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: theia-manager
          image: {{ include "theiaManagerImage" . | quote }}
          imagePullPolicy: {{ .Values.theiaManager.image.pullPolicy }}
          args:
            - --config
            - /etc/theia-manager/theia-manager.conf
            - --logtostderr=true
            - --log_dir=/var/log/antrea/theia-manager
            - --alsologtostderr
            - --log_file_max_size=100
            - --log_file_max_num=4
            {{- if .Values.theiaManager.logVerbosity }}
            - "--v={{ .Values.theiaManager.logVerbosity }}"
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef: 
                  name: clickhouse-secret
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: password
            - name: CLICKHOUSE_URL
              value: "tcp://clickhouse-clickhouse.{{ .Release.Namespace }}.svc:{{ .Values.clickhouse.service.tcpPort }}"
            - name: GOCOVERDIR
              value: "/theia-manager-coverage"
          resources:
            {{- toYaml .Values.theiaManager.resources | nindent 12 }}
          ports:
            - name: "theia-api-http"
              containerPort: {{ .Values.theiaManager.apiServer.apiPort }}
          volumeMounts:
            - mountPath: /var/run/theia
              name: theia-runtime
            - mountPath: /var/run/antrea
              name: antrea-runtime
            - mountPath: /etc/theia-manager
              name: theia-manager-config
              readOnly: true
            - mountPath: /var/run/theia/theia-manager-tls
              name: theia-manager-tls
            - mountPath: /var/log/antrea/theia-manager
              name: host-var-log-antrea-theia-manager
            - mountPath: /theia-manager-coverage
              name: theia-manager-coverage
      {{- with .Values.theiaManager.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      serviceAccountName: theia-manager
      volumes:
        - name: theia-runtime
          emptyDir: {}
        - name: antrea-runtime
          emptyDir: {}
        - name: theia-manager-config
          configMap:
            name: theia-manager-configmap
        # Make it optional as we only read it when selfSignedCert=false.
        - name: theia-manager-tls
          secret:
            secretName: theia-manager-tls
            defaultMode: 0400
            optional: true
        - name: host-var-log-antrea-theia-manager
          emptyDir: {}
        - name: theia-manager-coverage
          emptyDir: {}
{{- end }}
