{{- if (eq (len .Values.clickhouse.cluster.zookeeperHosts) 0) }}
{{- $enablePV := or .Values.clickhouse.cluster.installZookeeper.storage.createPersistentVolume.type .Values.clickhouse.cluster.installZookeeper.storage.persistentVolumeClaimSpec }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app: zookeeper
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: zookeeper
  serviceName: zookeepers
  replicas: {{ .Values.clickhouse.cluster.installZookeeper.replicas }}
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: zookeeper
        what: node
      annotations:
        prometheus.io/port: '7000'
        prometheus.io/scrape: 'true'
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                      - zookeeper
              topologyKey: "kubernetes.io/hostname"
      {{- with .Values.clickhouse.cluster.installZookeeper.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.clickhouse.cluster.installZookeeper.initChownData.enable }}
      initContainers:
        - name: init-chown-data
          image: {{ .Values.clickhouse.cluster.installZookeeper.initChownData.image.repository }}:{{ .Values.clickhouse.cluster.installZookeeper.initChownData.image.tag }}
          imagePullPolicy: {{ .Values.clickhouse.cluster.installZookeeper.initChownData.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            {{- toYaml .Values.clickhouse.cluster.installZookeeper.initChownData.resources | nindent 12 }}
          command:
            - chown
            - -R
            - "{{ .Values.clickhouse.cluster.installZookeeper.securityContext.runAsUser | default 65532 }}:{{ .Values.clickhouse.cluster.installZookeeper.securityContext.fsGroup | default 65532 }}"
            - /var/lib/zookeeper
          volumeMounts:
            - name: datadir-volume
              mountPath: /var/lib/zookeeper
      {{- end }}
      containers:
        - name: kubernetes-zookeeper
          workingDir: /opt/zookeeper
          env:
            - name: ZOO_LOG_DIR
              value: /var/lib/zookeeper/logs
          imagePullPolicy: {{ .Values.clickhouse.cluster.installZookeeper.image.pullPolicy }}
          image: {{ .Values.clickhouse.cluster.installZookeeper.image.repository }}:{{ .Values.clickhouse.cluster.installZookeeper.image.tag }}
          resources:
            {{- toYaml .Values.clickhouse.cluster.installZookeeper.resources | nindent 12 }}
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: server
            - containerPort: 3888
              name: leader-election
            - containerPort: 7000
              name: prometheus
# See those links for proper startup settings:
# https://github.com/kow3ns/kubernetes-zookeeper/blob/master/docker/scripts/start-zookeeper
# https://clickhouse.yandex/docs/en/operations/tips/#zookeeper
# https://github.com/ClickHouse/ClickHouse/issues/11781
          command:
            - bash
            - -c
            - |
              set -e
              SERVERS={{ .Values.clickhouse.cluster.installZookeeper.replicas }} &&
              HOST=${HOSTNAME%%.*} &&
              DOMAIN=zookeepers.{{ .Release.Namespace }}.svc.cluster.local &&
              CLIENT_PORT=2181 &&
              SERVER_PORT=2888 &&
              ELECTION_PORT=3888 &&
              PROMETHEUS_PORT=7000 &&
              ZOO_DATA_DIR=/var/lib/zookeeper/data &&
              ZOO_DATA_LOG_DIR=/var/lib/zookeeper/datalog &&
              {
                echo "clientPort=${CLIENT_PORT}"
                echo 'tickTime=2000'
                echo 'initLimit=300'
                echo 'syncLimit=10'
                echo 'maxClientCnxns=2000'
                echo 'maxSessionTimeout=60000000'
                echo "dataDir=${ZOO_DATA_DIR}"
                echo "dataLogDir=${ZOO_DATA_LOG_DIR}"
                echo 'autopurge.snapRetainCount=10'
                echo 'autopurge.purgeInterval=1'
                echo 'preAllocSize=131072'
                echo 'snapCount=3000000'
                echo 'leaderServes=yes'
                echo 'standaloneEnabled=false'
                echo '4lw.commands.whitelist=*'
                echo 'metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider'
                echo "metricsProvider.httpPort=${PROMETHEUS_PORT}"
              } > /opt/zookeeper/conf/zoo.cfg &&
              {
                echo "zookeeper.root.logger=CONSOLE"
                echo "zookeeper.console.threshold=INFO"
                echo "log4j.rootLogger=\${zookeeper.root.logger}"
                echo "log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender"
                echo "log4j.appender.CONSOLE.Threshold=\${zookeeper.console.threshold}"
                echo "log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout"
                echo "log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} [myid:%X{myid}] - %-5p [%t:%C{1}@%L] - %m%n"
              } > /opt/zookeeper/conf/log4j.properties &&
              echo 'JVMFLAGS="-Xms128M -Xmx1G -XX:+UseG1GC"' > /opt/zookeeper/conf/java.env &&
              if [[ $HOST =~ (.*)-([0-9]+)$ ]]; then
                  NAME=${BASH_REMATCH[1]}
                  ORD=${BASH_REMATCH[2]}
              else
                  echo "Failed to parse name and ordinal of Pod"
                  exit 1
              fi &&
              mkdir -p ${ZOO_DATA_DIR} &&
              mkdir -p ${ZOO_DATA_LOG_DIR} &&
              mkdir -p ${ZOO_LOG_DIR} &&
              export MY_ID=$((ORD+1)) &&
              echo $MY_ID > $ZOO_DATA_DIR/myid &&
              for (( i=1; i<=$SERVERS; i++ )); do
                  echo "server.$i=$NAME-$((i-1)).$DOMAIN:$SERVER_PORT:$ELECTION_PORT" >> /opt/zookeeper/conf/zoo.cfg;
              done &&
              if [[ $SERVERS -eq 1 ]]; then
                  echo "group.1=1" >> /opt/zookeeper/conf/zoo.cfg;
              else
                  groupstr="group.1=1"
                  for (( i=2; i<=$SERVERS; i++ )); do
                    groupstr+=":$i"
                  done
                  echo $groupstr >> /opt/zookeeper/conf/zoo.cfg;
              fi &&
              for (( i=1; i<=$SERVERS; i++ )); do
                  WEIGHT=1
                  if [[ $i == 1 ]]; then
                    WEIGHT=10
                  fi
                  echo "weight.$i=$WEIGHT" >> /opt/zookeeper/conf/zoo.cfg;
              done &&
              exec zkServer.sh start-foreground
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/2181; printf ruok >&3; IFS= read -r -t 3 -N 4 OK <&3; [[ "$OK" == imok ]]'
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/2181; printf ruok >&3; IFS= read -r -t 3 -N 4 OK <&3; [[ "$OK" == imok ]]'
            initialDelaySeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: datadir-volume
              mountPath: /var/lib/zookeeper
      {{- with .Values.clickhouse.cluster.installZookeeper.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- if not $enablePV }}
        - name: datadir-volume
          emptyDir:
            medium: ""
            sizeLimit: {{ .Values.clickhouse.cluster.installZookeeper.storage.size }}
      {{- else }}
        - name: datadir-volume
          persistentVolumeClaim:
            claimName: zookeeper-pvc
      {{- end }}
{{- end }}
