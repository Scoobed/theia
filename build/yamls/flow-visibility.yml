apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: zookeeper
  name: zookeeper
  namespace: flow-visibility
spec:
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  serviceName: zookeepers
  template:
    metadata:
      annotations:
        prometheus.io/port: "7000"
        prometheus.io/scrape: "true"
      labels:
        app: zookeeper
        what: node
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - zookeeper
            topologyKey: kubernetes.io/hostname
      containers:
      - command:
        - bash
        - -x
        - -c
        - |
          SERVERS=1 &&
          HOST=`hostname -s` &&
          DOMAIN=`hostname -d` &&
          CLIENT_PORT=2181 &&
          SERVER_PORT=2888 &&
          ELECTION_PORT=3888 &&
          PROMETHEUS_PORT=7000 &&
          ZOO_DATA_DIR=/var/lib/zookeeper/data &&
          ZOO_DATA_LOG_DIR=/var/lib/zookeeper/datalog &&
          {
            echo "clientPort=${CLIENT_PORT}"
            echo 'tickTime=2000'
            echo 'initLimit=300'
            echo 'syncLimit=10'
            echo 'maxClientCnxns=2000'
            echo 'maxSessionTimeout=60000000'
            echo "dataDir=${ZOO_DATA_DIR}"
            echo "dataLogDir=${ZOO_DATA_LOG_DIR}"
            echo 'autopurge.snapRetainCount=10'
            echo 'autopurge.purgeInterval=1'
            echo 'preAllocSize=131072'
            echo 'snapCount=3000000'
            echo 'leaderServes=yes'
            echo 'standaloneEnabled=false'
            echo '4lw.commands.whitelist=*'
            echo 'metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider'
            echo "metricsProvider.httpPort=${PROMETHEUS_PORT}"
          } > /conf/zoo.cfg &&
          {
            echo "zookeeper.root.logger=CONSOLE"
            echo "zookeeper.console.threshold=INFO"
            echo "log4j.rootLogger=\${zookeeper.root.logger}"
            echo "log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender"
            echo "log4j.appender.CONSOLE.Threshold=\${zookeeper.console.threshold}"
            echo "log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout"
            echo "log4j.appender.CONSOLE.layout.ConversionPattern=%d{ISO8601} [myid:%X{myid}] - %-5p [%t:%C{1}@%L] - %m%n"
          } > /conf/log4j.properties &&
          echo 'JVMFLAGS="-Xms128M -Xmx4G -XX:+UseG1GC -XX:ActiveProcessorCount=8"' > /conf/java.env &&
          if [[ $HOST =~ (.*)-([0-9]+)$ ]]; then
              NAME=${BASH_REMATCH[1]}
              ORD=${BASH_REMATCH[2]}
          else
              echo "Failed to parse name and ordinal of Pod"
              exit 1
          fi &&
          mkdir -p ${ZOO_DATA_DIR} &&
          mkdir -p ${ZOO_DATA_LOG_DIR} &&
          export MY_ID=$((ORD+1)) &&
          echo $MY_ID > $ZOO_DATA_DIR/myid &&
          for (( i=1; i<=$SERVERS; i++ )); do
              echo "server.$i=$NAME-$((i-1)).$DOMAIN:$SERVER_PORT:$ELECTION_PORT" >> /conf/zoo.cfg;
          done &&
          if [[ $SERVERS -eq 1 ]]; then
              echo "group.1=1" >> /conf/zoo.cfg;
          else
              groupstr="group.1=1"
              for (( i=2; i<=$SERVERS; i++ )); do
                groupstr+=":$i"
              done
              echo $groupstr >> /conf/zoo.cfg;
          fi &&
          for (( i=1; i<=$SERVERS; i++ )); do
              WEIGHT=1
              if [[ $i == 1 ]]; then
                WEIGHT=10
              fi
              echo "weight.$i=$WEIGHT" >> /conf/zoo.cfg;
          done &&
          chown -Rv zookeeper "$ZOO_DATA_DIR" "$ZOO_DATA_LOG_DIR" "$ZOO_LOG_DIR" &&
          chown zookeeper /conf/zoo.cfg /conf/log4j.properties /conf/java.env &&
          zkServer.sh start-foreground
        image: ghcr.io/scoobed/theia-zookeeper:3.9.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - OK=$(echo ruok | nc 127.0.0.1 2181); if [[ "$OK" == "imok" ]]; then
              exit 0; else exit 1; fi
          initialDelaySeconds: 10
          timeoutSeconds: 5
        name: kubernetes-zookeeper
        ports:
        - containerPort: 2181
          name: client
        - containerPort: 2888
          name: server
        - containerPort: 3888
          name: leader-election
        - containerPort: 7000
          name: prometheus
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - OK=$(echo ruok | nc 127.0.0.1 2181); if [[ "$OK" == "imok" ]]; then
              STATE=$(echo mntr | nc 127.0.0.1 2181 | grep zk_server_state | cut -d
              " " -f 2); if [[ "$STATE" == "leader" ]]; then SYNCED_FOLLOWERS=$(echo
              mntr | nc 127.0.0.1 2181 | grep zk_synced_followers | cut -d " " -f
              2 | cut -d "." -f 1); if [[ $SYNCED_FOLLOWERS == $(( $SERVERS - 1 ))
              ]]; then ./bin/zkCli.sh ls /; exit $?; else exit 1; fi; elif [[ "$STATE"
              == "follower" ]]; then PEER_STATE=$(echo mntr | nc 127.0.0.1 2181 |
              grep zk_peer_state); if [[ "$PEER_STATE" == "following - broadcast"
              ]]; then ./bin/zkCli.sh ls /; exit $?; else exit 1; fi; fi; else exit
              1; fi
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 512M
        volumeMounts:
        - mountPath: /var/lib/zookeeper
          name: datadir-volume
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      volumes:
      - name: datadir-volume
        persistentVolumeClaim:
          claimName: zookeeper-pvc
  updateStrategy:
    type: RollingUpdate
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pod-disruption-budget
  namespace: flow-visibility
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: zookeeper
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  labels:
    app: clickhouse
  name: clickhouse
  namespace: flow-visibility
spec:
  configuration:
    clusters:
    - layout:
        replicasCount: 1
        shardsCount: 1
      name: clickhouse
    profiles:
      readonly/readonly: 1
    settings:
      logger/count: 4
      logger/level: information
      logger/size: 100M
    users:
      clickhouse_operator/k8s_secret_password: flow-visibility/clickhouse-secret/password
      clickhouse_operator/networks/ip: ::/0
      readonly/k8s_secret_password: flow-visibility/clickhouse-secret/readOnlyPassword
      readonly/networks/ip: ::/0
      readonly/profile: readonly
    zookeeper:
      nodes:
      - host: zookeeper.flow-visibility.svc.cluster.local
  defaults:
    templates:
      dataVolumeClaimTemplate: clickhouse-storage-template
      podTemplate: pod-template
      serviceTemplate: service-template
  templates:
    podTemplates:
    - name: pod-template
      podDistribution:
      - number: 1
        topologyKey: kubernetes.io/hostname
        type: MaxNumberPerNode
      spec:
        containers:
        - command:
          - /bin/sh
          - -c
          - chown -R clickhouse:clickhouse /var/lib/clickhouse && /entrypoint.sh
          env:
          - name: THEIA_VERSION
            value: 0.9.2
          - name: CLICKHOUSE_INIT_TIMEOUT
            value: "60"
          - name: DB_URL
            value: localhost:9000
          - name: MIGRATE_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: clickhouse-secret
          - name: MIGRATE_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: clickhouse-secret
          image: ghcr.io/scoobed/theia-clickhouse-server:v0.9.2
          imagePullPolicy: IfNotPresent
          name: clickhouse
          volumeMounts:
          - mountPath: /docker-entrypoint-initdb.d
            name: clickhouse-configmap-volume
        - env:
          - name: CLICKHOUSE_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: clickhouse-secret
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: clickhouse-secret
          - name: DB_URL
            value: tcp://localhost:9000
          - name: TABLE_NAME
            value: default.flows_local
          - name: MV_NAMES
            value: default.pod_view_table_local default.node_view_table_local default.policy_view_table_local
          - name: STORAGE_SIZE
            value: 8Gi
          - name: THRESHOLD
            value: "0.5"
          - name: DELETE_PERCENTAGE
            value: "0.5"
          - name: EXEC_INTERVAL
            value: 1m
          - name: SKIP_ROUNDS_NUM
            value: "3"
          - name: GOCOVERDIR
            value: /clickhouse-monitor-coverage
          image: ghcr.io/scoobed/theia-clickhouse-monitor:v0.9.2
          imagePullPolicy: IfNotPresent
          name: clickhouse-monitor
          volumeMounts:
          - mountPath: /clickhouse-monitor-coverage
            name: clickhouse-monitor-coverage
        volumes:
        - configMap:
            defaultMode: 511
            items:
            - key: create_table.sh
              path: create_table.sh
            - key: init.sh
              path: init.sh
            - key: 000001_0-1-0.down.sql
              path: migrators/000001_0-1-0.down.sql
            - key: 000001_0-1-0.up.sql
              path: migrators/000001_0-1-0.up.sql
            - key: 000002_0-2-0.down.sql
              path: migrators/000002_0-2-0.down.sql
            - key: 000002_0-2-0.up.sql
              path: migrators/000002_0-2-0.up.sql
            - key: 000003_0-3-0.down.sql
              path: migrators/000003_0-3-0.down.sql
            - key: 000003_0-3-0.up.sql
              path: migrators/000003_0-3-0.up.sql
            - key: 000004_0-4-0.down.sql
              path: migrators/000004_0-4-0.down.sql
            - key: 000004_0-4-0.up.sql
              path: migrators/000004_0-4-0.up.sql
            - key: 000005_0-6-0.down.sql
              path: migrators/000005_0-6-0.down.sql
            - key: 000005_0-6-0.up.sql
              path: migrators/000005_0-6-0.up.sql
            - key: 000006_0-9-0.down.sql
              path: migrators/000006_0-9-0.down.sql
            - key: 000006_0-9-0.up.sql
              path: migrators/000006_0-9-0.up.sql
            name: clickhouse-mounted-configmap
          name: clickhouse-configmap-volume
        - hostPath:
            path: /var/log/cm-coverage
            type: DirectoryOrCreate
          name: clickhouse-monitor-coverage
    serviceTemplates:
    - name: service-template
      spec:
        ports:
        - name: http
          port: 8123
          targetPort: 8123
        - name: tcp
          port: 9000
          targetPort: 9000
        type: ClusterIP
    volumeClaimTemplates:
    - name: clickhouse-storage-template
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
        storageClassName: standard
