# golangci-lint configuration used for CI
version: "2"
run:
  tests: true
  timeout: 10m

issues:
  exclude-files:
    - '.*\.pb\.go'

linters:
  default: none
  enable:
    - misspell
    - staticcheck
    - gosec
    - govet
    - revive
  settings:
    revive:
      ignore-generated-header: false
      severity: warning
      confidence: 0.8
      rules:
        - name: unreachable-code
        - name: errorf
        - name: range
        - name: superfluous-else
        - name: var-declaration
        - name: duplicated-imports

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: antrea.io/theia
